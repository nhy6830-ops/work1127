<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="description" content="대학 AI 활용 윤리 가이드라인 (학습자용) — 교육부·한국대학교육협의회 2026">

  <title>대학 AI 활용 윤리 가이드라인 | 학습자용</title>

  <!-- Noto Sans KR (optional CDN for better rendering; falls back to system font if offline) -->
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
  <!-- <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet"> -->

</head>
<body>

  <div id="progress-bar" role="progressbar" aria-label="페이지 스크롤 진행도"></div>

  <main id="main">

    <section id="section-hero" aria-labelledby="hero-title"></section>

    <!-- 01. 취지 및 목적 -->
    <section id="section-purpose" aria-label="취지 및 목적"></section>

    <!-- 02. 5대 원칙 -->
    <section id="section-principles" aria-label="5대 핵심 원칙"></section>

    <!-- 03-1. 수업별 AI 활용 유형 -->
    <section id="section-usage" aria-label="수업별 AI 활용 유형"></section>

    <section id="section-citation" aria-label="인용 및 출처 표기"></section>

    <!-- 05. 체크리스트 -->
    <section id="section-checklist" aria-label="자가 체크리스트 및 AI 활용 기록표"></section>

    <!-- 마무리 -->
    <section id="section-closing" aria-label="마무리"></section>

  </main>

  <!-- ── Footer ──────────────────────────────── -->
  <footer id="footer" role="contentinfo"></footer>

  <!-- ── Toast Notification ─────────────────── -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ── Back to Top ────────────────────────── -->
  <button id="back-top" aria-label="맨 위로 이동" title="맨 위로">↑</button>

  <!-- ── Scripts (순서 중요: data → app) ───── -->
  <script src="js/data.js"></script>
